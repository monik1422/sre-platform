# OTel Collector (daemonset). One collector per node handles two pipelines:
#   traces: OTLP in  -> Tempo (OTLP/gRPC)
#   logs:   filelog (container stdout) -> Loki (OTLP/HTTP)
# Metrics are scraped by Prometheus directly from app /metrics (not via here).
mode: daemonset

image:
  repository: otel/opentelemetry-collector-contrib   # contrib has the loki/k8s bits

# Presets wire up the filelog receiver, host mounts, and the RBAC needed for
# the k8sattributes processor — production-standard, avoids hand-rolled config.
presets:
  logsCollection:
    enabled: true
    includeCollectorLogs: false
  kubernetesAttributes:
    enabled: true

resources:
  requests: {cpu: 100m, memory: 128Mi}
  limits:   {cpu: 500m, memory: 256Mi}

securityContext:
  # filelog must read /var/log/pods (root-owned); this preset pod runs as root
  # by design. It lives in the "privileged" observability namespace only.
  runAsUser: 0

ports:
  otlp:
    enabled: true
    containerPort: 4317
    servicePort: 4317
    protocol: TCP
  otlp-http:
    enabled: true
    containerPort: 4318
    servicePort: 4318
    protocol: TCP

config:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: ${env:MY_POD_IP}:4317
        http:
          endpoint: ${env:MY_POD_IP}:4318
  processors:
    memory_limiter:
      check_interval: 5s
      limit_percentage: 80
      spike_limit_percentage: 25
    batch:
      send_batch_size: 1024
      timeout: 5s
    resourcedetection:
      detectors: [env, system]
      override: false
  exporters:
    otlp/tempo:
      endpoint: "tempo.observability.svc:4317"
      tls:
        insecure: true
    otlphttp/loki:
      endpoint: "http://loki.observability.svc:3100/otlp"
      tls:
        insecure: true
    debug:
      verbosity: normal
  service:
    telemetry:
      metrics:
        level: detailed
    pipelines:
      traces:
        receivers: [otlp]
        processors: [memory_limiter, k8sattributes, resourcedetection, batch]
        exporters: [otlp/tempo]
      logs:
        receivers: [filelog]
        processors: [memory_limiter, k8sattributes, resourcedetection, batch]
        exporters: [otlphttp/loki]

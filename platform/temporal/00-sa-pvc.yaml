---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: temporal
  namespace: temporal
  labels: {app.kubernetes.io/name: temporal, app.kubernetes.io/part-of: sre-platform}
automountServiceAccountToken: false   # Temporal never talks to the API server
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: temporal-data
  namespace: temporal
  labels: {app.kubernetes.io/name: temporal, app.kubernetes.io/part-of: sre-platform}
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-path
  resources:
    requests:
      storage: 2Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: temporal
  namespace: temporal
  labels:
    app.kubernetes.io/name: temporal
    app.kubernetes.io/part-of: sre-platform
spec:
  replicas: 1
  strategy:
    type: Recreate           # RWO volume — never two writers
  selector:
    matchLabels: {app.kubernetes.io/name: temporal}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: temporal
        app.kubernetes.io/part-of: sre-platform
    spec:
      serviceAccountName: temporal
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: temporal
          image: "temporalio/server:1.25.1"   # Temporal CLI image (see README: version pins)
          args:
            - "server"
            - "start-dev"
            - "--ip=0.0.0.0"
            - "--port=7233"
            - "--http-port=7243"
            - "--ui-port=8080"
#            - "--namespace=default"
            - "--namespace=sre"          # dedicated namespace for our workflows
            - "--db-filename=/data/temporal.db"
            - "--log-level=info"
          ports:
            - {name: grpc, containerPort: 7233}
            - {name: http, containerPort: 7243}
            - {name: ui,   containerPort: 8080}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits:   {cpu: 500m, memory: 512Mi}
          livenessProbe:
            tcpSocket: {port: grpc}
            initialDelaySeconds: 15
            periodSeconds: 15
          readinessProbe:
            tcpSocket: {port: grpc}
            initialDelaySeconds: 10
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: tmp,  mountPath: /tmp}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: temporal-data
        - name: tmp
          emptyDir: {}

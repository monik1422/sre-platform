---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-sample-api-red
  namespace: observability
  labels:
    grafana_dashboard: "1"
    app.kubernetes.io/part-of: sre-platform
data:
  sample-api-red.json: |
    {
      "uid": "sample-api-red",
      "title": "sample-api • RED + SLO",
      "tags": ["sre-platform", "red", "slo"],
      "timezone": "browser",
      "schemaVersion": 39,
      "refresh": "10s",
      "time": {"from": "now-1h", "to": "now"},
      "templating": {"list": []},
      "panels": [
        {
          "id": 1, "type": "timeseries", "title": "Request rate by code (Rate)",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 0},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [{
            "expr": "sum by (code) (rate(http_requests_total{service=\"sample-api\"}[1m]))",
            "legendFormat": "{{code}}"
          }]
        },
        {
          "id": 2, "type": "timeseries", "title": "Error ratio vs SLO budget (Errors)",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 0},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"unit": "percentunit",
            "thresholds": {"mode": "absolute", "steps": [
              {"color": "green", "value": null}, {"color": "red", "value": 0.005}]}}},
          "targets": [{
            "expr": "job:sample_api_request_errors:ratio_rate5m",
            "legendFormat": "5m error ratio"
          }]
        },
        {
          "id": 3, "type": "timeseries", "title": "Latency p50 / p95 / p99 (Duration)",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 8},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"unit": "s"}},
          "targets": [
            {"expr": "histogram_quantile(0.50, sum(rate(http_request_duration_seconds_bucket{service=\"sample-api\"}[5m])) by (le))", "legendFormat": "p50"},
            {"expr": "histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket{service=\"sample-api\"}[5m])) by (le))", "legendFormat": "p95"},
            {"expr": "histogram_quantile(0.99, sum(rate(http_request_duration_seconds_bucket{service=\"sample-api\"}[5m])) by (le))", "legendFormat": "p99"}
          ]
        },
        {
          "id": 4, "type": "stat", "title": "Fast-burn rate (x budget)",
          "gridPos": {"h": 8, "w": 6, "x": 12, "y": 8},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"decimals": 1,
            "thresholds": {"mode": "absolute", "steps": [
              {"color": "green", "value": null},
              {"color": "orange", "value": 6},
              {"color": "red", "value": 14.4}]}}},
          "targets": [{"expr": "job:sample_api_request_errors:ratio_rate1h / 0.005"}]
        },
        {
          "id": 5, "type": "stat", "title": "Availability (1h)",
          "gridPos": {"h": 8, "w": 6, "x": 18, "y": 8},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"unit": "percentunit", "decimals": 3,
            "thresholds": {"mode": "absolute", "steps": [
              {"color": "red", "value": null}, {"color": "green", "value": 0.995}]}}},
          "targets": [{"expr": "1 - job:sample_api_request_errors:ratio_rate1h"}]
        }
      ]
    }

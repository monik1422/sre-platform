---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ai-sre-agent
  namespace: ai-sre
  labels: {app.kubernetes.io/name: ai-sre-agent, app.kubernetes.io/part-of: sre-platform}
# The agent DOES call the Kube API (read pods/events for RCA), so the token
# is mounted — but the role below is strictly read-only, namespaced, and
# limited to pods/events. Least privilege for an investigative agent.
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ai-sre-agent-read
  namespace: ai-sre
  labels: {app.kubernetes.io/part-of: sre-platform}
rules:
  - apiGroups: [""]
    resources: ["pods", "events"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ai-sre-agent-read
  namespace: ai-sre
  labels: {app.kubernetes.io/part-of: sre-platform}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: ai-sre-agent-read}
subjects:
  - {kind: ServiceAccount, name: ai-sre-agent, namespace: ai-sre}
---
# Read-only access into the sample-api namespace so the agent can see the
# workload it is diagnosing (restarts, warning events).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ai-sre-agent-read
  namespace: sample-api
  labels: {app.kubernetes.io/part-of: sre-platform}
rules:
  - apiGroups: [""]
    resources: ["pods", "events"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ai-sre-agent-read
  namespace: sample-api
  labels: {app.kubernetes.io/part-of: sre-platform}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: ai-sre-agent-read}
subjects:
  - {kind: ServiceAccount, name: ai-sre-agent, namespace: ai-sre}

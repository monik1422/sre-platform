[project]
name = "ai-sre-agent"
version = "1.0.0"
description = "AI SRE agent: queries the LGTM stack and produces structured RCA reports."
requires-python = ">=3.11"
dependencies = [
    "anthropic==0.34.2",
    "httpx==0.27.2",
    "pydantic==2.9.2",
    "temporalio==1.7.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
pythonpath = ["src"]

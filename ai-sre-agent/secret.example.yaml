# EXAMPLE ONLY — do not commit a real key, and do not place this file under
# ai-sre-agent/deploy/ (Argo CD syncs that directory).
#
# The real secret is seeded out-of-band by bootstrap.sh from the
# ANTHROPIC_API_KEY environment variable (ADR-005). In production this is
# delivered by External Secrets Operator or a Sealed Secret so the encrypted
# material CAN live safely in Git.
#
# Manual creation, if ever needed:
#   kubectl -n ai-sre create secret generic anthropic-credentials \
#     --from-literal=api-key="sk-ant-..."
apiVersion: v1
kind: Secret
metadata:
  name: anthropic-credentials
  namespace: ai-sre
type: Opaque
stringData:
  api-key: "REPLACE_ME"

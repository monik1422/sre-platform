---
# Two projects enforce a blast-radius boundary between platform infrastructure
# and product workloads. Each restricts which repos, destinations, and cluster
# resources its apps may touch (least privilege for the GitOps controller).
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: platform
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  description: Cluster platform services (observability, Temporal, config)
  sourceRepos:
    - "https://github.com/monik1422/sre-platform.git"
    - "https://prometheus-community.github.io/helm-charts"
    - "https://grafana.github.io/helm-charts"
    - "https://go.temporal.io/helm-charts"
    - "https://open-telemetry.github.io/opentelemetry-helm-charts"
  destinations:
    - server: https://kubernetes.default.svc
      namespace: "observability"
    - server: https://kubernetes.default.svc
      namespace: "temporal"
    - server: https://kubernetes.default.svc
      namespace: "platform-system"
  clusterResourceWhitelist:
    - group: "*"
      kind: "*"
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
  orphanedResources:
    warn: true
---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: apps
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  description: Product workloads (sample-api) and the AI SRE agent
  sourceRepos:
    - "https://github.com/monik1422/sre-platform.git"
  destinations:
    - server: https://kubernetes.default.svc
      namespace: "sample-api"
    - server: https://kubernetes.default.svc
      namespace: "ai-sre"
  # Product apps may not create cluster-scoped resources — namespaced only.
  clusterResourceWhitelist: []
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
  orphanedResources:
    warn: true

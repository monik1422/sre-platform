---
# The single Application applied by bootstrap.sh. It renders every child
# Application under argocd/apps/ (the "app-of-apps" pattern). From here,
# adding a workload to the platform == committing a new Application manifest.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform
  source:
    # 👉 Change this to your fork before bootstrapping.
    repoURL: "https://github.com/monik1422/sre-platform.git"
    targetRevision: main
    path: argocd/apps
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false   # namespaces are their own managed app (ordered via sync-wave)
